<!DOCTYPE html>

<html>
    <head>
        <title>Não encontrado</title>
        <meta charset="${_response_encoding}">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
        <link rel="stylesheet" href="@{'/public/stylesheets/main.css'}">
    </head>
    <body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

        <div style="width: 100%; max-width: 560px; padding: 16px;">
            <div class="card form-card">
                <div class="card-body p-4 text-center">
                    <h1 style="color: var(--brand-blue); font-weight: 800;">
                        <i class="bi bi-search" style="color: var(--brand-gold);"></i> 404
                    </h1>
                    <h4 style="color: var(--brand-blue);">Página não encontrada</h4>
                    <p class="text-muted">O endereço acessado não existe ou o registro foi removido.</p>

                    <p class="small text-muted">${result.message}</p>

                    <a href="javascript:history.back()" class="btn btn-outline-dark">Voltar</a>
                    <a href="@{Reservas.listar}" class="btn btn-brand">Ir para Reservas</a>
                </div>
            </div>
        </div>

    </body>
</html>
