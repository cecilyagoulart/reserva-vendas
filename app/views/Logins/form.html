<!DOCTYPE html>
<html>
<head>
    <title>Entrar - INFO4V Reservas</title>
    <meta charset="${_response_encoding}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="@{'/public/stylesheets/main.css'}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div style="width: 100%; max-width: 380px; padding: 16px;">

        <h1 class="text-center mb-4" style="color: var(--brand-blue); font-weight: 800;">
            INFO4V Reservas
        </h1>

        #{if flash.error}
            <div class="alert alert-danger">${flash.error}</div>
        #{/if}

        <div class="card form-card">
            <div class="card-body p-4">
                <form action="@{Logins.logar}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Login</label>
                        <input type="text" name="login" class="form-control" autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-brand w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
